<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="400" height="240">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softglow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="240" fill="#0D1117"/>

  <!-- Stars (random field) -->
  <rect x="25" y="25" width="2" height="2" fill="#ffffff" opacity="0.9"/>
  <rect x="65" y="18" width="2" height="2" fill="#ffffff" opacity="0.6"/>
  <rect x="95" y="32" width="2" height="2" fill="#ffffff" opacity="0.8"/>
  <rect x="170" y="22" width="3" height="3" fill="#ffffff" opacity="0.7"/>
  <rect x="220" y="14" width="2" height="2" fill="#ffffff" opacity="0.9"/>
  <rect x="290" y="30" width="2" height="2" fill="#ffffff" opacity="0.5"/>
  <rect x="350" y="19" width="2" height="2" fill="#ffffff" opacity="0.8"/>
  <rect x="375" y="36" width="2" height="2" fill="#ffffff" opacity="0.7"/>
  <rect x="40" y="195" width="2" height="2" fill="#ffffff" opacity="0.8"/>
  <rect x="120" y="208" width="2" height="2" fill="#ffffff" opacity="0.6"/>
  <rect x="300" y="203" width="2" height="2" fill="#ffffff" opacity="0.9"/>
  <rect x="360" y="196" width="3" height="3" fill="#ffffff" opacity="0.7"/>
  <rect x="18" y="120" width="2" height="2" fill="#ffffff" opacity="0.5"/>
  <rect x="380" y="110" width="2" height="2" fill="#ffffff" opacity="0.6"/>
  <rect x="55" y="150" width="2" height="2" fill="#ffffff" opacity="0.4"/>
  <rect x="340" y="145" width="2" height="2" fill="#ffffff" opacity="0.7"/>

  <!-- Green pixel border -->
  <rect x="0" y="0" width="400" height="8" fill="#00FF41"/>
  <rect x="0" y="232" width="400" height="8" fill="#00FF41"/>
  <rect x="0" y="0" width="8" height="240" fill="#00FF41"/>
  <rect x="392" y="0" width="8" height="240" fill="#00FF41"/>

  <!-- Space Invader (Classic Type 1 - 11x8, pixel size 16x16) -->
  <!-- Centered: x_start=112, y_start=40 -->
  <!-- col_x = 112 + col*16, row_y = 40 + row*16 -->

  <g filter="url(#glow)" fill="#00FF41">
    <!-- Row 0 (y=40): cols [2, 8] -->
    <rect x="144" y="40" width="16" height="16"/>
    <rect x="240" y="40" width="16" height="16"/>

    <!-- Row 1 (y=56): cols [3, 7] -->
    <rect x="160" y="56" width="16" height="16"/>
    <rect x="224" y="56" width="16" height="16"/>

    <!-- Row 2 (y=72): cols [2,3,4,5,6,7,8] -->
    <rect x="144" y="72" width="16" height="16"/>
    <rect x="160" y="72" width="16" height="16"/>
    <rect x="176" y="72" width="16" height="16"/>
    <rect x="192" y="72" width="16" height="16"/>
    <rect x="208" y="72" width="16" height="16"/>
    <rect x="224" y="72" width="16" height="16"/>
    <rect x="240" y="72" width="16" height="16"/>

    <!-- Row 3 (y=88): cols [1,2,4,5,6,8,9] -->
    <rect x="128" y="88" width="16" height="16"/>
    <rect x="144" y="88" width="16" height="16"/>
    <rect x="176" y="88" width="16" height="16"/>
    <rect x="192" y="88" width="16" height="16"/>
    <rect x="208" y="88" width="16" height="16"/>
    <rect x="240" y="88" width="16" height="16"/>
    <rect x="256" y="88" width="16" height="16"/>

    <!-- Row 4 (y=104): cols [0-10] all -->
    <rect x="112" y="104" width="16" height="16"/>
    <rect x="128" y="104" width="16" height="16"/>
    <rect x="144" y="104" width="16" height="16"/>
    <rect x="160" y="104" width="16" height="16"/>
    <rect x="176" y="104" width="16" height="16"/>
    <rect x="192" y="104" width="16" height="16"/>
    <rect x="208" y="104" width="16" height="16"/>
    <rect x="224" y="104" width="16" height="16"/>
    <rect x="240" y="104" width="16" height="16"/>
    <rect x="256" y="104" width="16" height="16"/>
    <rect x="272" y="104" width="16" height="16"/>

    <!-- Row 5 (y=120): cols [0,2,3,4,5,6,7,8,10] -->
    <rect x="112" y="120" width="16" height="16"/>
    <rect x="144" y="120" width="16" height="16"/>
    <rect x="160" y="120" width="16" height="16"/>
    <rect x="176" y="120" width="16" height="16"/>
    <rect x="192" y="120" width="16" height="16"/>
    <rect x="208" y="120" width="16" height="16"/>
    <rect x="224" y="120" width="16" height="16"/>
    <rect x="240" y="120" width="16" height="16"/>
    <rect x="272" y="120" width="16" height="16"/>

    <!-- Row 6 (y=136): cols [0,2,8,10] -->
    <rect x="112" y="136" width="16" height="16"/>
    <rect x="144" y="136" width="16" height="16"/>
    <rect x="240" y="136" width="16" height="16"/>
    <rect x="272" y="136" width="16" height="16"/>

    <!-- Row 7 (y=152): cols [3,4,6,7] -->
    <rect x="160" y="152" width="16" height="16"/>
    <rect x="176" y="152" width="16" height="16"/>
    <rect x="224" y="152" width="16" height="16"/>
    <rect x="240" y="152" width="16" height="16"/>
  </g>

  <!-- Pulsing glow overlay for invader (subtle animation) -->
  <g fill="#00FF41" opacity="0">
    <rect x="112" y="40" width="176" height="128"/>
    <animate attributeName="opacity" values="0;0.08;0" dur="2.5s" repeatCount="indefinite"/>
  </g>

  <!-- Score / footer text -->
  <text x="200" y="205" font-family="monospace" font-size="12" fill="#00FF41"
        text-anchor="middle" filter="url(#softglow)">✦ SCORE: 1337  ★  LEVEL: MAX ✦</text>

  <!-- Blinking cursor -->
  <rect x="322" y="194" width="8" height="2" fill="#00FF41">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>
</svg>
