name: Apify Vivino Test (와인 1개)

on:
  workflow_dispatch:   # 수동 실행 전용

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install apify-client
        run: pip install -q apify-client

      - name: Run Apify test
        env:
          APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
        run: python3 apify_test.py

      - name: Upload result JSON
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apify_test_result
          path: apify_test_result.json

      - name: Commit result
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/tmuchal/README.git
          git add apify_test_result.json || true
          git diff --staged --quiet || git commit -m "test: apify_test_result.json [skip ci]"
          git push origin HEAD:claude/vivino-wine-scraper-6idX4
