name: Vivino Wine Scraper

on:
  push:
    branches: [ "claude/vivino-wine-scraper-6idX4" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install selenium==4.* webdriver-manager

      - name: Install Chrome
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q google-chrome-stable
          google-chrome --version

      - name: Run Vivino scraper
        run: |
          python3 - <<'PYEOF'
          import csv, re, time, json, os
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.chrome.service import Service
          from selenium.webdriver.common.by import By
          from webdriver_manager.chrome import ChromeDriverManager

          URLS = [
              ("Varvaglione Papale Primitivo di Manduria",  "https://www.vivino.com/en/varvaglione-papale-primitivo-di-manduria-primitivo-di-manduria/w/1506422"),
              ("Chateau de Saint Cosme Les Deux Albion",    "https://www.vivino.com/en/chateau-de-saint-cosme-les-deux-albion-principaute-d-orange/w/35424"),
              ("Gaston Burtin Extra Brut Champagne",        "https://www.vivino.com/en/gaston-burtin-extra-brut-champagne/w/12489584"),
              ("La Sala Chianti Classico",                  "https://www.vivino.com/IT/en/it-la-sala-chianti-classico/w/2140869"),
              ("Prototype Cabernet Sauvignon",              "https://www.vivino.com/en/prototype-cabernet-sauvignon/w/5733636"),
              ("Prototype Zinfandel",                       "https://www.vivino.com/en/prototype-zinfandel/w/6172116"),
              ("Prototype Chardonnay",                      "https://www.vivino.com/en/prototype-chardonnay/w/7553744"),
              ("Mahi Sauvignon Blanc",                      "https://www.vivino.com/en/mahi-sauvignon-blanc/w/1112088"),
              ("Mahi Pinot Noir",                           "https://www.vivino.com/en/mahi-pinot-noir/w/1112105"),
              ("Terramater Magis Carmenere",                "https://www.vivino.com/en/terramater-magis-limited-reserve-carmenere/w/9597776"),
              ("Terramater Magis Cabernet Sauvignon",       "https://www.vivino.com/en/terramater-magis-limited-reserve-cabernet-sauvignon/w/7247216"),
              ("Vinum Cellars Cabernet Sauvignon",          "https://www.vivino.com/en/us-vinum-cellars-us-cabernet-sauvignon/w/90074"),
              ("De Montfaucon Baron Louis Lirac",           "https://www.vivino.com/en/de-montfaucon-baron-louis-lirac-cotes-du-rhone/w/1117640"),
              ("19 Crimes Cabernet Sauvignon",              "https://www.vivino.com/en/nineteen-crimes-cabernet-sauvignon-victoria-red-wine-v/w/3736213"),
              ("Bread and Butter Chardonnay",               "https://www.vivino.com/en/bread-and-butter-chardonnay/w/1755251"),
              ("Apothic Red",                               "https://www.vivino.com/en/apothic-red-winemaker-s-blend/w/1130327"),
              ("Delaunois d Fils La Royale Champagne",      "https://www.vivino.com/en/delaunois-d-fils-la-royale-champagne-premier-cru/w/3952842"),
          ]

          def left_to_score(pct):
              return round(1 + (pct / 100) * 4, 2)

          # --- Chrome options with anti-detection ---
          opts = Options()
          opts.add_argument("--headless=new")
          opts.add_argument("--no-sandbox")
          opts.add_argument("--disable-dev-shm-usage")
          opts.add_argument("--disable-gpu")
          opts.add_argument("--window-size=1920,1080")
          opts.add_argument("--disable-blink-features=AutomationControlled")
          opts.add_argument("--disable-extensions")
          opts.add_argument("--lang=en-US,en")
          opts.add_argument("user-agent=Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36")
          opts.add_experimental_option("excludeSwitches", ["enable-automation"])
          opts.add_experimental_option("useAutomationExtension", False)

          driver = webdriver.Chrome(
              service=Service(ChromeDriverManager().install()),
              options=opts,
          )
          # Hide webdriver flag
          driver.execute_cdp_cmd("Page.addScriptToEvaluateOnNewDocument", {
              "source": "Object.defineProperty(navigator, 'webdriver', {get: () => undefined})"
          })

          # ---- DEBUG: save HTML of first wine page to file ----
          debug_url = URLS[15][1]  # Apothic Red - popular wine, less likely blocked
          print(f"DEBUG: loading {debug_url}")
          driver.get(debug_url)
          time.sleep(5)
          driver.execute_script("window.scrollTo(0, 800)")
          time.sleep(2)
          src = driver.page_source
          print(f"DEBUG: page source length = {len(src)}")
          print(f"DEBUG: page title = {driver.title[:100]}")

          # Save relevant HTML snippets to debug file
          debug_lines = []
          debug_lines.append(f"URL: {debug_url}")
          debug_lines.append(f"Title: {driver.title}")
          debug_lines.append(f"Source length: {len(src)}")
          debug_lines.append("")

          # All elements with style containing left or width %
          elems = driver.find_elements(By.XPATH, '//*[contains(@style,"left:") or contains(@style,"width:")]')
          debug_lines.append(f"=== Elements with left/width style: {len(elems)} ===")
          for el in elems[:30]:
              tag = el.tag_name
              cls = el.get_attribute("class") or ""
              style = el.get_attribute("style") or ""
              testid = el.get_attribute("data-testid") or ""
              if any(x in style for x in ['left:', 'width:']):
                  debug_lines.append(f"  <{tag} class='{cls[:60]}' data-testid='{testid}' style='{style[:80]}'>")

          debug_lines.append("")

          # Find taste-related keywords in HTML
          for kw in ["tasteStructure", "taste-structure", "TasteStructure", "indicator", "slider", "progressBar",
                     "left:", "tannin", "acidity", "sweetness", "body", "fizziness"]:
              positions = [m.start() for m in re.finditer(re.escape(kw), src, re.I)]
              if positions:
                  debug_lines.append(f"=== '{kw}' found {len(positions)} times, first at {positions[0]} ===")
                  p = positions[0]
                  debug_lines.append(src[max(0,p-100):p+300])
                  debug_lines.append("")

          with open("debug_vivino.txt", "w", encoding="utf-8") as f:
              f.write("\n".join(debug_lines))
          print("DEBUG file saved")

          # Also try to find taste data via JSON in page source
          # Look for __NEXT_DATA__ or similar
          json_matches = re.findall(r'<script[^>]*>(.*?)</script>', src, re.S)
          for i, j in enumerate(json_matches):
              if any(k in j.lower() for k in ['tannin', 'acidity', 'taste', 'slider']):
                  with open(f"debug_script_{i}.txt", "w", encoding="utf-8") as f:
                      f.write(j[:5000])
                  print(f"  Saved debug_script_{i}.txt (taste keyword found)")

          driver.quit()
          print("DEBUG done - check debug_vivino.txt in the repository")
          PYEOF

      - name: Commit debug files
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/tmuchal/README.git
          git add debug_vivino.txt debug_script_*.txt 2>/dev/null || true
          git diff --staged --quiet || git commit -m "Add Vivino debug HTML output [skip ci]"
          git push origin HEAD:claude/vivino-wine-scraper-6idX4
